  /recruiter/applications/{applicationId}/evaluation/review:
    put:
      tags:
        - M06 Evaluación asistida
      summary: Guardar revisión humana y pesos de la evaluación
      description: Envía cada requisito exactamente una vez. Pesos no negativos con dos decimales que suman 60 o 100 según modalidad; son propios de esta evaluación, no crean una rúbrica global para ordenar postulantes. review=null conserva un requisito sin revisar. Toda valoración salvo INSUFFICIENT_EVIDENCE exige referencias existentes y explicación. MEETS=100 %, PARTIAL=50 %, DOES_NOT_MEET=0 % del peso. Sin evidencia o revisión, incluso con peso cero, total=null. El historial conserva actor, fecha y revisiones. No selecciona, descarta ni cambia el estado del postulante.
      security:
        - CookieSession: []
