openapi: 3.0.3
info:
  title: Qori Talento API — endpoints implementados
  version: 0.3.0
  description: >-
    Sistema, base M01 y M02: ofertas propias, requisitos y consulta de publicadas.
    Activación y OTP pendientes de B-03. Publicación de particulares y moderación
    pendientes de B-01/B-02. Los módulos M03-M08 todavía no están implementados.
servers:
  - url: /api/v1
components:
  securitySchemes:
    CookieSession: {type: apiKey, in: cookie, name: qt_session}
  parameters:
    ClientHeader:
      name: X-Qori-Client
      in: header
      required: true
      schema: {type: string, enum: [web]}
      description: Cabecera obligatoria en mutaciones JSON; no se habilita CORS.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string, format: uuid}
    ProfileInput:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        email: {type: string, format: email, maxLength: 254}
        phone: {type: string, nullable: true, minLength: 7, maxLength: 32}
    RegisterCandidate:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password, minLength: 8, maxLength: 128, writeOnly: true}
        phone: {type: string, nullable: true, maxLength: 32}
    RegisterRecruiter:
      type: object
      additionalProperties: false
      required: [name, email, password, kind]
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        email: {type: string, format: email, maxLength: 254, description: Correo corporativo para COMPANY; filtro básico de proveedores públicos conocidos.}
        password: {type: string, format: password, minLength: 8, maxLength: 128, writeOnly: true}
        kind: {type: string, enum: [COMPANY, INDIVIDUAL]}
        phone: {type: string, nullable: true, maxLength: 32, description: Obligatorio para INDIVIDUAL.}
    User:
      type: object
      required: [id, name, email, phone, role, kind, account_state, email_verified, phone_verified]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: string, nullable: true}
        role: {type: string, enum: [CANDIDATE, RECRUITER]}
        kind: {type: string, nullable: true, enum: [COMPANY, INDIVIDUAL, null]}
        account_state: {type: string}
        email_verified: {type: boolean}
        phone_verified: {type: boolean}
    Session:
      type: object
      required: [user, expires_at]
      properties:
        user: {$ref: '#/components/schemas/User'}
        expires_at: {type: string, format: date-time}
    JobInput:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 10000
          default: ""
        requirements:
          type: array
          maxItems: 50
          default: []
          items:
            type: object
            additionalProperties: false
            required:
              - description
            properties:
              description:
                type: string
                minLength: 1
                maxLength: 1000
        area:
          type: string
          nullable: true
          maxLength: 120
        location:
          type: string
          nullable: true
          maxLength: 180
        experience_required:
          type: string
          nullable: true
          maxLength: 2000
        education_required:
          type: string
          nullable: true
          maxLength: 2000
    JobPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 10000
          default: ""
        requirements:
          type: array
          maxItems: 50
          default: []
          items:
            type: object
            additionalProperties: false
            required:
              - description
            properties:
              description:
                type: string
                minLength: 1
                maxLength: 1000
        area:
          type: string
          nullable: true
          maxLength: 120
        location:
          type: string
          nullable: true
          maxLength: 180
        experience_required:
          type: string
          nullable: true
          maxLength: 2000
        education_required:
          type: string
          nullable: true
          maxLength: 2000
    PublishedJob:
      type: object
      required:
        - title
        - description
        - requirements
        - area
        - location
        - experience_required
        - education_required
        - id
        - status
        - published_at
        - closed_at
        - created_at
        - updated_at
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 10000
          default: ""
        requirements:
          type: array
          maxItems: 50
          default: []
          items:
            type: object
            additionalProperties: false
            required:
              - description
            properties:
              description:
                type: string
                minLength: 1
                maxLength: 1000
        area:
          type: string
          nullable: true
          maxLength: 120
        location:
          type: string
          nullable: true
          maxLength: 180
        experience_required:
          type: string
          nullable: true
          maxLength: 2000
        education_required:
          type: string
          nullable: true
          maxLength: 2000
        id:
          type: string
        status:
          type: string
          description: DRAFT, PUBLISHED o CLOSED; estados heredados desconocidos no admiten cambios.
        published_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OwnedJob:
      allOf:
        - $ref: "#/components/schemas/PublishedJob"
        - type: object
          required:
            - owner_user_id
          properties:
            owner_user_id:
              type: string
  responses:
    Error:
      description: Error controlado; el código y mensaje indican el motivo. No incluye información interna.
      headers:
        X-Request-ID: {schema: {type: string, format: uuid}, description: Identificador de la solicitud.}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Registered:
      description: Cuenta persistida. En producción queda inactiva hasta verificación; en desarrollo (NODE_ENV=development) se permite iniciar sesión para pruebas. No envía OTP.
      content:
        application/json:
          schema:
            type: object
            required: [user, message]
            properties:
              user: {$ref: '#/components/schemas/User'}
              message: {type: string}
    Session:
      description: Datos de la cuenta propia y vencimiento del servidor; nunca incluye el token.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Session'}
paths:
  /system/health:
    get:
      tags: [Sistema]
      summary: Comprobar API sin depender de MySQL
      responses:
        '200':
          description: API activa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: qori-talento-api}
  /system/db-check:
    get:
      tags: [Sistema]
      summary: Comprobar MySQL (solo fuera de producción)
      responses:
        '200':
          description: SELECT 1 ejecutado
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: {type: boolean}
        '503': {$ref: '#/components/responses/Error'}
  /auth/candidates/register:
    post:
      tags: [Auth]
      summary: Registrar postulante (inactivo en producción)
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterCandidate'}
      responses:
        '201': {$ref: '#/components/responses/Registered'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/recruiters/register:
    post:
      tags: [Auth]
      summary: Registrar reclutador de empresa o particular (inactivo en producción)
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRecruiter'}
      responses:
        '201': {$ref: '#/components/responses/Registered'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión con cuenta activa y verificada
      description: >-
        Cookie de navegador HttpOnly, SameSite=Strict, Path=/api; Secure en producción.
        Token aleatorio de 256 bits; solo su hash se guarda en MySQL.
        Caducidad por inactividad configurable con SESSION_IDLE_MINUTES (30 en desarrollo).
        En producción, sin cuentas activadas por la aplicación mientras B-03 siga pendiente;
        en desarrollo se permite el acceso para pruebas.
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, format: password, maxLength: 128, writeOnly: true}
      responses:
        '200':
          description: Sesión iniciada; se establece qt_session.
          headers:
            Set-Cookie: {schema: {type: string}, description: Cookie HttpOnly; el token no aparece en JSON.}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revocar sesión actual y borrar cookie (idempotente)
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '204': {description: Sesión revocada; cookie eliminada.}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/session/refresh:
    post:
      tags: [Auth]
      summary: Renovar por actividad una sesión que todavía no ha expirado
      security: [{CookieSession: []}]
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /me:
    get:
      tags: [Auth]
      summary: Consultar solo el perfil de la sesión validada
      security: [{CookieSession: []}]
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Auth]
      summary: Actualizar nombre, correo y teléfono propios
      description: >-
        No acepta user_id, role, kind ni account_state. Cambiar el correo invalida su verificación;
        cambiar el teléfono de un particular invalida su verificación telefónica.
        Ambos casos dejan la cuenta pendiente y revocan todas sus sesiones en la misma transacción.
      security: [{CookieSession: []}]
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileInput'}
      responses:
        '200':
          description: Cambios persistidos; verification_required indica si debe verificarse otra vez.
          content:
            application/json:
              schema:
                type: object
                required: [user, verification_required]
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  verification_required: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /jobs:
    get:
      tags:
        - Ofertas
      summary: Listar ofertas publicadas para el postulante
      description: Sesión activa del rol correspondiente. No admite user_id ni owner_user_id como filtros. Respuestas sin
        caché; lista vacía válida.
      security:
        - CookieSession: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 180
          description: Texto literal en cargo, descripción o ubicación; también código QT-id.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - page
                  - page_size
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublishedJob"
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /jobs/{jobId}:
    get:
      tags:
        - Ofertas
      summary: Consultar detalle de una oferta publicada
      description: Oferta ajena o no disponible en el alcance devuelve 404.
      security:
        - CookieSession: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,19}$
          description: Decimal positivo, máximo BIGINT UNSIGNED.
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /recruiter/jobs:
    get:
      tags:
        - Ofertas
      summary: Listar ofertas propias del reclutador
      description: Sesión activa del rol correspondiente. No admite user_id ni owner_user_id como filtros. Respuestas sin
        caché; lista vacía válida.
      security:
        - CookieSession: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 180
          description: Texto literal en cargo, descripción o ubicación; también código QT-id.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum:
              - DRAFT
              - PUBLISHED
              - CLOSED
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - page
                  - page_size
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OwnedJob"
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Ofertas
      summary: Crear oferta en borrador
      description: Propietario obtenido de la sesión. Solo cargo obligatorio. COMPANY e INDIVIDUAL pueden guardar borradores;
        no se aplica una cuota aún no definida.
      security:
        - CookieSession: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "201":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedJob"
          headers:
            Location:
              schema:
                type: string
              description: Ruta del detalle propio.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
  /recruiter/jobs/{jobId}:
    get:
      tags:
        - Ofertas
      summary: Consultar oferta propia, incluidos borradores y cerradas
      description: Oferta ajena o no disponible en el alcance devuelve 404.
      security:
        - CookieSession: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,19}$
          description: Decimal positivo, máximo BIGINT UNSIGNED.
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Ofertas
      summary: Editar datos y requisitos de una oferta propia
      description: PATCH conserva campos omitidos y sustituye requirements si se incluye. No modifica estado ni propietario.
        Una publicada debe conservar descripción y al menos un requisito. Guardado transaccional con bloqueo de la oferta.
      security:
        - CookieSession: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,19}$
          description: Decimal positivo, máximo BIGINT UNSIGNED.
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobPatch"
  /recruiter/jobs/{jobId}/publish:
    post:
      tags:
        - Ofertas
      summary: Publicar borrador propio de empresa
      description: "Solo COMPANY: DRAFT → PUBLISHED, con descripción y al menos un requisito. INDIVIDUAL devuelve 403
        PUBLICATION_PENDING_RULES por B-01/B-02. Repetir PUBLISHED es idempotente. No reabre CLOSED; otros estados
        devuelven 409."
      security:
        - CookieSession: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,19}$
          description: Decimal positivo, máximo BIGINT UNSIGNED.
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
  /recruiter/jobs/{jobId}/close:
    post:
      tags:
        - Ofertas
      summary: Cerrar oferta publicada propia
      description: PUBLISHED → CLOSED. La oferta deja de aparecer en listado/detalle de postulantes. Repetir CLOSED es
        idempotente; otros estados devuelven 409. La recepción de postulaciones corresponde a M03, aún no implementado.
      security:
        - CookieSession: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,19}$
          description: Decimal positivo, máximo BIGINT UNSIGNED.
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
