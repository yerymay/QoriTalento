  /recruiter/applications/{applicationId}/evaluation/assist:
    post:
      tags:
        - M06 Evaluación asistida
      summary: Solicitar sugerencias de Ollama local
      description: Compara requisitos con fuentes profesionales del perfil confirmado. Referencias inexistentes, duplicadas o sin evidencia para una valoración se rechazan. No sustituye revisiones humanas. Timeout de 120 segundos; el cliente debe esperar hasta 130 segundos. Conflicto 409 si cambia revisión o fuentes durante la llamada; 422 si el contenido es demasiado extenso, 429 si el modelo está ocupado, 502 si la respuesta no pasa la validación, 503 si Ollama falla. La salida siempre requiere revisión.
      security:
        - CookieSession: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,19}$
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - revision
              properties:
                revision:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Desglose indicativo; total nulo mientras falte revisión, evidencia o un único examen finalizado. No modifica estados de selección.
