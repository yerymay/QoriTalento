openapi: 3.0.3
info:
  title: Qori Talento API — endpoints implementados
  version: 0.4.0
  description: >-
    Sistema, base M01 y M02: ofertas propias, requisitos y consulta de publicadas.
    Las cuentas se activan al registrarse, sin OTP ni aprobación externa. Cualquier reclutador puede publicar varias ofertas completas sin cuota ni moderación previa. M03 incluye postulaciones con PDF y reemplazo del CV pendiente. M04 extrae texto y propone datos editables, actualiza el perfil al confirmar y permite revisión privada con notas. M05-M08 siguen pendientes.
servers:
  - url: /api/v1
components:
  securitySchemes:
    CookieSession: {type: apiKey, in: cookie, name: qt_session}
  parameters:
    ClientHeader:
      name: X-Qori-Client
      in: header
      required: true
      schema: {type: string, enum: [web]}
      description: Cabecera obligatoria en mutaciones JSON y multipart; no se habilita CORS.
  schemas:
    CvProfile:
      type: object
      additionalProperties: false
      required: [name, email, phone, location, summary, education, experience, skills, languages]
      properties:
        name: {type: string, maxLength: 160, minLength: 2}
        email: {type: string, maxLength: 254}
        phone: {type: string, maxLength: 32}
        location: {type: string, maxLength: 200}
        summary: {type: string, maxLength: 4000}
        education:
          type: array
          maxItems: 30
          items: {type: string, maxLength: 4000}
        experience:
          type: array
          maxItems: 30
          items: {type: string, maxLength: 4000}
        skills:
          type: array
          maxItems: 80
          items: {type: string, maxLength: 200}
        languages:
          type: array
          maxItems: 80
          items: {type: string, maxLength: 200}
    CvConfirmed:
      type: object
      nullable: true
      required: [id, source_cv_id, confirmed_at, profile]
      properties:
        id: {type: string}
        source_cv_id: {type: string}
        confirmed_at: {type: string, format: date-time}
        profile: {$ref: '#/components/schemas/CvProfile'}
    CvReview:
      type: object
      required: [application_id, title, status, document, extraction, confirmed, current_profile_id, can_confirm]
      properties:
        application_id: {type: string}
        title: {type: string}
        status: {type: string, nullable: true}
        document:
          type: object
          nullable: true
          properties:
            id: {type: string}
            filename: {type: string}
        extraction:
          type: object
          nullable: true
          description: Solo para el postulante. Los campos vacíos son datos no detectados; no son datos confirmados.
          properties:
            version: {type: string}
            profile:
              type: object
              description: Mismos nueve campos de CvProfile; name puede estar vacío antes de confirmar.
              additionalProperties: true
            text: {type: string}
            warnings: {type: array, items: {type: string}}
            evidence:
              type: object
              additionalProperties:
                type: array
                items:
                  type: object
                  properties:
                    page: {type: integer, minimum: 1}
                    text: {type: string}
        confirmed: {$ref: '#/components/schemas/CvConfirmed'}
        current_profile_id: {type: string, nullable: true}
        can_confirm: {type: boolean}
    CvNotes:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, body, created_at]
            properties:
              id: {type: string}
              body: {type: string, maxLength: 4000}
              created_at: {type: string, format: date-time}
    ApplicationM03:
      type: object
      required: [id, job_id, title, status, created_at, submitted_at, filename]
      properties:
        id: {type: string}
        job_id: {type: string}
        title: {type: string}
        status: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        submitted_at: {type: string, format: date-time, nullable: true}
        filename: {type: string, nullable: true}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string, format: uuid}
    ProfileInput:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        email: {type: string, format: email, maxLength: 254}
        phone: {type: string, nullable: true, minLength: 7, maxLength: 32}
    RegisterCandidate:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password, minLength: 8, maxLength: 128, writeOnly: true}
        phone: {type: string, nullable: true, maxLength: 32}
    RegisterRecruiter:
      type: object
      additionalProperties: false
      required: [name, email, password, kind]
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        email: {type: string, format: email, maxLength: 254, description: Correo corporativo para COMPANY; filtro básico de proveedores públicos conocidos.}
        password: {type: string, format: password, minLength: 8, maxLength: 128, writeOnly: true}
        kind: {type: string, enum: [COMPANY, INDIVIDUAL]}
        phone: {type: string, nullable: true, maxLength: 32, description: Obligatorio para INDIVIDUAL.}
    User:
      type: object
      required: [id, name, email, phone, role, kind, account_state, email_verified, phone_verified]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: string, nullable: true}
        role: {type: string, enum: [CANDIDATE, RECRUITER]}
        kind: {type: string, nullable: true, enum: [COMPANY, INDIVIDUAL, null]}
        account_state: {type: string}
        email_verified: {type: boolean}
        phone_verified: {type: boolean}
    Session:
      type: object
      required: [user, expires_at]
      properties:
        user: {$ref: '#/components/schemas/User'}
        expires_at: {type: string, format: date-time}
    JobInput:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 10000
          default: ""
        requirements:
          type: array
          maxItems: 50
          default: []
          items:
            type: object
            additionalProperties: false
            required:
              - description
            properties:
              description:
                type: string
                minLength: 1
                maxLength: 1000
        area:
          type: string
          nullable: true
          maxLength: 120
        location:
          type: string
          nullable: true
          maxLength: 180
        experience_required:
          type: string
          nullable: true
          maxLength: 2000
        education_required:
          type: string
          nullable: true
          maxLength: 2000
    JobPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 10000
          default: ""
        requirements:
          type: array
          maxItems: 50
          default: []
          items:
            type: object
            additionalProperties: false
            required:
              - description
            properties:
              description:
                type: string
                minLength: 1
                maxLength: 1000
        area:
          type: string
          nullable: true
          maxLength: 120
        location:
          type: string
          nullable: true
          maxLength: 180
        experience_required:
          type: string
          nullable: true
          maxLength: 2000
        education_required:
          type: string
          nullable: true
          maxLength: 2000
    PublishedJob:
      type: object
      required:
        - title
        - description
        - requirements
        - area
        - location
        - experience_required
        - education_required
        - id
        - status
        - published_at
        - closed_at
        - created_at
        - updated_at
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 10000
          default: ""
        requirements:
          type: array
          maxItems: 50
          default: []
          items:
            type: object
            additionalProperties: false
            required:
              - description
            properties:
              description:
                type: string
                minLength: 1
                maxLength: 1000
        area:
          type: string
          nullable: true
          maxLength: 120
        location:
          type: string
          nullable: true
          maxLength: 180
        experience_required:
          type: string
          nullable: true
          maxLength: 2000
        education_required:
          type: string
          nullable: true
          maxLength: 2000
        id:
          type: string
        status:
          type: string
          description: DRAFT, PUBLISHED o CLOSED; estados heredados desconocidos no admiten cambios.
        published_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OwnedJob:
      allOf:
        - $ref: "#/components/schemas/PublishedJob"
        - type: object
          required:
            - owner_user_id
          properties:
            owner_user_id:
              type: string
  responses:
    Error:
      description: Error controlado; el código y mensaje indican el motivo. No incluye información interna.
      headers:
        X-Request-ID: {schema: {type: string, format: uuid}, description: Identificador de la solicitud.}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Registered:
      description: Cuenta persistida y activa; puede iniciar sesión inmediatamente. No requiere OTP, verificación ni aprobación externa.
      content:
        application/json:
          schema:
            type: object
            required: [user, message]
            properties:
              user: {$ref: '#/components/schemas/User'}
              message: {type: string}
    Session:
      description: Datos de la cuenta propia y vencimiento del servidor; nunca incluye el token.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Session'}
paths:
  /candidate/applications/{applicationId}/cv-extraction:
    get:
      tags: [CV]
      summary: Consultar propuesta y perfil confirmado propios; extrae CV anteriores a M04 al abrir
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvReview'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /candidate/applications/{applicationId}/cv/{documentId}:
    get:
      tags: [CV]
      summary: Consultar PDF privado por versión; comprueba propiedad de la postulación u oferta
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        - name: documentId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /recruiter/applications/{applicationId}/cv-extraction:
    get:
      tags: [CV]
      summary: Consultar perfil confirmado de una postulación de una oferta propia
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvReview'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /recruiter/applications/{applicationId}/cv/{documentId}:
    get:
      tags: [CV]
      summary: Consultar PDF privado por versión; comprueba propiedad de la postulación u oferta
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        - name: documentId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /candidate/applications/{applicationId}/profile-confirmation:
    put:
      tags: [CV]
      summary: Confirmar correcciones y actualizar perfil curricular, nombre y teléfono; conserva el correo de acceso
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        - {$ref: '#/components/parameters/ClientHeader'}
      description: Requiere postulación PENDING y CV vigente. Repetir el mismo contenido es idempotente. Un CV ya confirmado no admite cambios (B-07). Conflictos de documento o perfil concurrente devuelven 409. El contenido completo del perfil no puede superar 60000 bytes JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [document_id, base_profile_id, profile]
              properties:
                document_id: {type: string}
                base_profile_id: {type: string, nullable: true}
                profile: {$ref: '#/components/schemas/CvProfile'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvReview'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /candidate/profile:
    get:
      tags: [CV]
      summary: Consultar la última versión curricular confirmada del usuario
      security: [{CookieSession: []}]
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: {$ref: '#/components/schemas/CvConfirmed'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /recruiter/jobs/{jobId}/applications:
    get:
      tags: [CV]
      summary: Listar postulaciones para revisar CV de una oferta propia
      security: [{CookieSession: []}]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}
                        title: {type: string}
                        confirmed: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /recruiter/applications/{applicationId}/notes:
    get:
      tags: [CV]
      summary: Consultar notas propias de revisión del CV
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvNotes'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    post:
      tags: [CV]
      summary: Agregar una nota sin modificar el perfil fuente
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        - {$ref: '#/components/parameters/ClientHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 4000}
      responses:
        '201':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvNotes'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /recruiter/jobs/{jobId}/finish:
    post:
      tags: [Postulaciones]
      summary: Finalizar el proceso de selección de una oferta propia
      description: Cierra la recepción, registra la fecha de finalización e inicia el plazo de conservación. Es idempotente.
      security: [{CookieSession: []}]
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/ClientHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, maxProperties: 0}
      responses:
        '200':
          description: Proceso finalizado
          content:
            application/json:
              schema:
                type: object
                required: [finished_at]
                properties:
                  finished_at: {type: string, format: date-time}
        '400': {description: Entrada inválida}
        '401': {description: Sesión no válida}
        '403': {description: Rol u origen no autorizado}
        '404': {description: Oferta ajena o inexistente}
        '409': {description: Oferta en borrador}
  /applications:
    get:
      tags: [Postulaciones]
      summary: Consultar las postulaciones del candidato autenticado
      security: [{CookieSession: []}]
      responses:
        '200':
          description: Postulaciones propias
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ApplicationM03'}
        '401': {description: Sesión no válida}
        '403': {description: Rol no autorizado}
  /jobs/{jobId}/applications:
    post:
      tags: [Postulaciones]
      summary: Registrar una postulación con CV PDF
      description: La oferta debe estar publicada. Se rechazan postulaciones activas duplicadas.
      security: [{CookieSession: []}]
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/ClientHeader'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cv]
              properties:
                cv: {type: string, format: binary, description: 'PDF con texto seleccionable de hasta 5 MB (5.000.000 bytes), 40 páginas y 160.000 caracteres extraídos. La extracción M04 se guarda junto al archivo.'}
      responses:
        '201':
          description: Postulación registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationM03'}
        '400': {description: PDF inválido}
        '401': {description: Sesión no válida}
        '403': {description: Rol u origen no autorizado}
        '404': {description: Oferta no disponible}
        '409': {description: Postulación activa existente}
        '413': {description: Archivo demasiado grande}
  /applications/{applicationId}/cv:
    put:
      tags: [Postulaciones]
      summary: Reemplazar el CV de una postulación propia pendiente de evaluación
      security: [{CookieSession: []}]
      parameters:
        - {name: applicationId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/ClientHeader'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cv]
              properties:
                cv: {type: string, format: binary}
      responses:
        '200':
          description: CV actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationM03'}
        '400': {description: PDF inválido}
        '401': {description: Sesión no válida}
        '403': {description: Rol u origen no autorizado}
        '404': {description: Postulación no encontrada}
        '409': {description: El estado no permite reemplazar el CV}
        '413': {description: Archivo demasiado grande}
  /system/health:
    get:
      tags: [Sistema]
      summary: Comprobar API sin depender de MySQL
      responses:
        '200':
          description: API activa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: qori-talento-api}
  /system/db-check:
    get:
      tags: [Sistema]
      summary: Comprobar MySQL (solo fuera de producción)
      responses:
        '200':
          description: SELECT 1 ejecutado
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: {type: boolean}
        '503': {$ref: '#/components/responses/Error'}
  /auth/candidates/register:
    post:
      tags: [Auth]
      summary: Registrar postulante (activo de inmediato)
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterCandidate'}
      responses:
        '201': {$ref: '#/components/responses/Registered'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/recruiters/register:
    post:
      tags: [Auth]
      summary: Registrar reclutador de empresa o particular (activo de inmediato)
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRecruiter'}
      responses:
        '201': {$ref: '#/components/responses/Registered'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión con cuenta activa y verificada
      description: >-
        Cookie de navegador HttpOnly, SameSite=Strict, Path=/api; Secure en producción.
        Token aleatorio de 256 bits; solo su hash se guarda en MySQL.
        Caducidad por inactividad configurable con SESSION_IDLE_MINUTES (30 en desarrollo).
        Las cuentas nuevas quedan activas y pueden iniciar sesión de inmediato, sin verificación ni aprobación externa.
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, format: password, maxLength: 128, writeOnly: true}
      responses:
        '200':
          description: Sesión iniciada; se establece qt_session.
          headers:
            Set-Cookie: {schema: {type: string}, description: Cookie HttpOnly; el token no aparece en JSON.}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revocar sesión actual y borrar cookie (idempotente)
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '204': {description: Sesión revocada; cookie eliminada.}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/session/refresh:
    post:
      tags: [Auth]
      summary: Renovar por actividad una sesión que todavía no ha expirado
      security: [{CookieSession: []}]
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /me:
    get:
      tags: [Auth]
      summary: Consultar solo el perfil de la sesión validada
      security: [{CookieSession: []}]
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Auth]
      summary: Actualizar nombre, correo y teléfono propios
      description: >-
        No acepta user_id, role, kind ni account_state. Cambiar el correo o teléfono revoca todas las sesiones en la misma transacción; la cuenta se mantiene activa.
      security: [{CookieSession: []}]
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileInput'}
      responses:
        '200':
          description: Cambios persistidos; verification_required indica que se cerró la sesión y debe iniciarse nuevamente por seguridad, no que se requiera una verificación externa.
          content:
            application/json:
              schema:
                type: object
                required: [user, verification_required]
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  verification_required: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /jobs:
    get:
      tags:
        - Ofertas
      summary: Listar ofertas publicadas para el postulante
      description: Sesión activa del rol correspondiente. No admite user_id ni owner_user_id como filtros. Respuestas sin
        caché; lista vacía válida.
      security:
        - CookieSession: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 180
          description: Texto literal en cargo, descripción o ubicación; también código QT-id.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - page
                  - page_size
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublishedJob"
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /jobs/{jobId}:
    get:
      tags:
        - Ofertas
      summary: Consultar detalle de una oferta publicada
      description: Oferta ajena o no disponible en el alcance devuelve 404.
      security:
        - CookieSession: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,19}$
          description: Decimal positivo, máximo BIGINT UNSIGNED.
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /recruiter/jobs:
    get:
      tags:
        - Ofertas
      summary: Listar ofertas propias del reclutador
      description: Sesión activa del rol correspondiente. No admite user_id ni owner_user_id como filtros. Respuestas sin
        caché; lista vacía válida.
      security:
        - CookieSession: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 180
          description: Texto literal en cargo, descripción o ubicación; también código QT-id.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum:
              - DRAFT
              - PUBLISHED
              - CLOSED
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - page
                  - page_size
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OwnedJob"
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Ofertas
      summary: Crear oferta en borrador
      description: Propietario obtenido de la sesión. Solo cargo obligatorio. COMPANY e INDIVIDUAL pueden guardar borradores;
        no se aplica una cuota aún no definida.
      security:
        - CookieSession: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "201":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedJob"
          headers:
            Location:
              schema:
                type: string
              description: Ruta del detalle propio.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
  /recruiter/jobs/{jobId}:
    get:
      tags:
        - Ofertas
      summary: Consultar oferta propia, incluidos borradores y cerradas
      description: Oferta ajena o no disponible en el alcance devuelve 404.
      security:
        - CookieSession: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,19}$
          description: Decimal positivo, máximo BIGINT UNSIGNED.
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Ofertas
      summary: Editar datos y requisitos de una oferta propia
      description: PATCH conserva campos omitidos y sustituye requirements si se incluye. No modifica estado ni propietario.
        Una publicada debe conservar descripción y al menos un requisito. Guardado transaccional con bloqueo de la oferta.
      security:
        - CookieSession: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,19}$
          description: Decimal positivo, máximo BIGINT UNSIGNED.
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobPatch"
  /recruiter/jobs/{jobId}/publish:
    post:
      tags:
        - Ofertas
      summary: Publicar borrador propio
      description: "Cualquier reclutador: DRAFT → PUBLISHED, con descripción y al menos un requisito. Repetir PUBLISHED
        es idempotente. No reabre CLOSED; otros estados devuelven 409."
      security:
        - CookieSession: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,19}$
          description: Decimal positivo, máximo BIGINT UNSIGNED.
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
  /recruiter/jobs/{jobId}/close:
    post:
      tags:
        - Ofertas
      summary: Cerrar oferta publicada propia
      description: PUBLISHED → CLOSED. La oferta deja de aparecer en listado/detalle de postulantes. Repetir CLOSED es
        idempotente; otros estados devuelven 409. La recepción de postulaciones corresponde a M03, aún no implementado.
      security:
        - CookieSession: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,19}$
          description: Decimal positivo, máximo BIGINT UNSIGNED.
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
