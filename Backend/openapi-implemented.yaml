openapi: 3.0.3
info:
  title: Qori Talento API — endpoints implementados
  version: 0.8.0
  description: >-
    Sistema, base M01 y M02: ofertas propias, requisitos y consulta de publicadas.
    Las cuentas se activan al registrarse, sin OTP ni aprobación externa. Cualquier reclutador puede publicar varias ofertas completas sin cuota ni moderación previa. M03 incluye postulaciones con PDF y reemplazo del CV pendiente. M04 extrae texto y propone datos editables, actualiza el perfil al confirmar y permite revisión privada con notas. M05 implementa pruebas técnicas con publicación inmutable y reloj del servidor. M06 implementa calificación objetiva y revisión asistida por requisito con Ollama local y revisión humana; la fórmula 60/40 o perfil sobre 100 es indicativa y requiere validación para uso real. M07 incorpora resultados indicativos y selección humana sin reversión; M08 permite al postulante consultar estados e historial propios, con aislamiento y sin datos internos de selección.
servers:
  - url: /api/v1
components:
  securitySchemes:
    CookieSession: {type: apiKey, in: cookie, name: qt_session}
  parameters:
    ClientHeader:
      name: X-Qori-Client
      in: header
      required: true
      schema: {type: string, enum: [web]}
      description: Cabecera obligatoria en mutaciones JSON y multipart; no se habilita CORS.
  schemas:
    TrackingApplication:
      type: object
      required:
        - id
        - job_id
        - title
        - status
        - job_status
        - registered_at
        - process_finished_at
        - filename
        - status_at
        - final
        - can_replace_cv
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
        job_id:
          type: string
          pattern: ^[1-9][0-9]*$
        title:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - IN_REVIEW
            - SHORTLISTED
            - ADVANCES
            - NOT_ADVANCES
          nullable: true
        job_status:
          type: string
        registered_at:
          type: string
          format: date-time
        process_finished_at:
          type: string
          format: date-time
          nullable: true
        filename:
          type: string
          nullable: true
        status_at:
          type: string
          format: date-time
          nullable: true
        final:
          type: boolean
        can_replace_cv:
          type: boolean
    TrackingPage:
      type: object
      required:
        - items
        - total
        - page
        - page_size
        - checked_at
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrackingApplication"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
          enum:
            - 20
        checked_at:
          type: string
          format: date-time
    TrackingDetail:
      type: object
      required:
        - application
        - history
        - history_complete
        - checked_at
      properties:
        application:
          $ref: "#/components/schemas/TrackingApplication"
        history:
          type: array
          items:
            type: object
            required:
              - status
              - at
            properties:
              status:
                type: string
                enum:
                  - PENDING
                  - IN_REVIEW
                  - SHORTLISTED
                  - ADVANCES
                  - NOT_ADVANCES
                nullable: false
              at:
                type: string
                format: date-time
        history_complete:
          type: boolean
        checked_at:
          type: string
          format: date-time
    SelectionState:
      type: string
      enum:
        - PENDING
        - IN_REVIEW
        - SHORTLISTED
        - ADVANCES
        - NOT_ADVANCES
    SelectionRecord:
      type: object
      required:
        - id
        - job_id
        - job_title
        - name
        - email
        - status
        - submitted_at
        - process_finished
        - decision
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
        job_id:
          type: string
          pattern: ^[1-9][0-9]*$
        job_title:
          type: string
        name:
          type: string
        email:
          type: string
        status:
          type: string
          nullable: true
        submitted_at:
          type: string
          nullable: true
          format: date-time
        process_finished:
          type: boolean
        decision:
          type: object
          required:
            - state
            - reason
            - actor_id
            - actor_name
            - at
          properties:
            state:
              $ref: "#/components/schemas/SelectionState"
            reason:
              type: string
              nullable: true
            actor_id:
              type: string
              pattern: ^[1-9][0-9]*$
            actor_name:
              type: string
            at:
              type: string
              format: date-time
          nullable: true
    SelectionResults:
      type: object
      required:
        - grades
        - exam_count
        - profile_points
        - profile_max
        - total
        - pending
        - stale
        - reviewed
      properties:
        grades:
          type: array
          items:
            type: object
            required:
              - title
              - percent
            properties:
              title:
                type: string
              percent:
                type: number
        exam_count:
          type: integer
        profile_points:
          type: number
          nullable: true
        profile_max:
          type: integer
          enum:
            - 60
            - 100
        total:
          type: number
          nullable: true
        pending:
          type: array
          items:
            type: string
        stale:
          type: boolean
        reviewed:
          type: boolean
      nullable: true
    SelectionRow:
      allOf:
        - $ref: "#/components/schemas/SelectionRecord"
        - type: object
          required:
            - allowed_actions
            - results
          properties:
            allowed_actions:
              type: array
              items:
                $ref: "#/components/schemas/SelectionState"
            results:
              $ref: "#/components/schemas/SelectionResults"
    SelectionPage:
      type: object
      required:
        - items
        - total
        - page
        - page_size
        - indicative
        - ranking_enabled
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SelectionRow"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
          enum:
            - 20
        indicative:
          type: boolean
          enum:
            - true
        ranking_enabled:
          type: boolean
          enum:
            - false
    SelectionDetail:
      type: object
      required:
        - record
        - allowed_actions
        - history
        - profile
        - evaluation
      properties:
        record:
          $ref: "#/components/schemas/SelectionRecord"
        allowed_actions:
          type: array
          items:
            $ref: "#/components/schemas/SelectionState"
        history:
          type: array
          items:
            type: object
            required:
              - previous_state
              - next_state
              - actor_name
              - at
            properties:
              previous_state:
                type: string
                nullable: true
              next_state:
                type: string
              actor_name:
                type: string
                nullable: true
              at:
                type: string
                format: date-time
        profile:
          allOf:
            - $ref: "#/components/schemas/CvProfile"
          nullable: true
        evaluation:
          $ref: "#/components/schemas/EvaluationView"
    SelectionInput:
      type: object
      required:
        - state
        - expected_status
        - confirmed
      properties:
        state:
          $ref: "#/components/schemas/SelectionState"
        expected_status:
          $ref: "#/components/schemas/SelectionState"
        confirmed:
          type: boolean
          enum:
            - true
        reason:
          type: string
          maxLength: 2000
          nullable: true
      additionalProperties: false
    EvaluationAssessment:
      type: object
      additionalProperties: false
      required:
        - rating
        - source_refs
        - explanation
      properties:
        rating:
          type: string
          enum:
            - MEETS
            - PARTIAL
            - DOES_NOT_MEET
            - INSUFFICIENT_EVIDENCE
        source_refs:
          type: array
          items:
            type: string
        explanation:
          type: string
          minLength: 1
          maxLength: 2000
    EvaluationCriterion:
      type: object
      additionalProperties: false
      required:
        - id
        - text
        - weight
        - suggestion
        - review
      properties:
        id:
          type: string
        text:
          type: string
        weight:
          type: number
          minimum: 0
          maximum: 100
        suggestion:
          $ref: "#/components/schemas/EvaluationAssessment"
          nullable: true
        review:
          $ref: "#/components/schemas/EvaluationAssessment"
          nullable: true
    EvaluationDocument:
      type: object
      additionalProperties: false
      required:
        - revision
        - fingerprint
        - profile_version_id
        - sources
        - criteria
        - profile_max
        - model
        - prompt_version
        - reviewed_by
        - reviewed_at
      properties:
        revision:
          type: integer
          minimum: 1
        fingerprint:
          type: string
        profile_version_id:
          type: string
        sources:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - ref
              - text
            properties:
              ref:
                type: string
              text:
                type: string
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationCriterion"
        profile_max:
          type: integer
          enum:
            - 60
            - 100
        model:
          type: string
          nullable: true
        prompt_version:
          type: string
          nullable: true
        reviewed_by:
          type: string
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
    EvaluationGrade:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - exam_id
        - title
        - status
        - correct
        - total
        - unanswered
        - percent
      properties:
        attempt_id:
          type: string
        exam_id:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
            - SUBMITTED
            - EXPIRED
        correct:
          type: integer
        total:
          type: integer
          minimum: 1
        unanswered:
          type: integer
        percent:
          type: number
          minimum: 0
          maximum: 100
    EvaluationView:
      type: object
      additionalProperties: false
      required:
        - application_id
        - job_id
        - job_title
        - candidate_name
        - confirmed
        - requirement_count
        - evaluation
        - stale
        - grades
        - exam_count
        - profile_max
        - profile_points
        - exam_points
        - total
        - pending
        - indicative
        - filter_questions_scored
      properties:
        application_id:
          type: string
        job_id:
          type: string
        job_title:
          type: string
        candidate_name:
          type: string
          nullable: true
        confirmed:
          type: boolean
        requirement_count:
          type: integer
        evaluation:
          $ref: "#/components/schemas/EvaluationDocument"
          nullable: true
        stale:
          type: boolean
        grades:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationGrade"
        exam_count:
          type: integer
        profile_max:
          type: integer
          enum:
            - 60
            - 100
        profile_points:
          type: number
        exam_points:
          type: number
          nullable: true
        total:
          type: number
          nullable: true
        pending:
          type: array
          items:
            type: string
        indicative:
          type: boolean
          enum:
            - true
        filter_questions_scored:
          type: boolean
          enum:
            - false
    EvaluationReviewInput:
      type: object
      additionalProperties: false
      required:
        - revision
        - criteria
      properties:
        revision:
          type: integer
          minimum: 1
        criteria:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - weight
              - review
            properties:
              id:
                type: string
              weight:
                type: number
                minimum: 0
                maximum: 100
                multipleOf: 0.01
              review:
                $ref: "#/components/schemas/EvaluationAssessment"
                nullable: true
    ExamInput:
      type: object
      additionalProperties: false
      required:
        - title
        - time_limit_minutes
        - questions
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        time_limit_minutes:
          type: integer
          minimum: 1
          maximum: 480
        questions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - text
              - options
            properties:
              text:
                type: string
                maxLength: 6000
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - text
                    - is_correct
                  properties:
                    text: &a3
                      type: string
                      maxLength: 2000
                    is_correct: &a4
                      type: boolean
                minItems: 2
                maxItems: 6
          maxItems: 50
      description: "Borrador: admite cero preguntas y contenido incompleto. Publicar
        exige al menos una pregunta completa y exactamente una clave por pregunta.
        Tamaño total máximo 90 KB UTF-8."
    OwnedExam:
      type: object
      additionalProperties: false
      required:
        - id
        - job_id
        - job_title
        - title
        - time_limit_seconds
        - version_number
        - status
        - questions
      properties:
        id: &a1
          type: string
          pattern: ^[1-9][0-9]{0,19}$
        job_id: *a1
        job_title: &a2
          type: string
        title: *a2
        time_limit_seconds: &a5
          type: integer
        version_number: &a6
          type: integer
        status: &a7
          type: string
          enum:
            - DRAFT
            - PUBLISHED
        questions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - text
              - options
            properties:
              id: *a1
              text: *a2
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - id
                    - text
                    - is_correct
                  properties:
                    id: *a1
                    text: *a3
                    is_correct: *a4
    ExamSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - job_id
        - job_title
        - title
        - time_limit_seconds
        - version_number
        - status
      properties:
        id: *a1
        job_id: *a1
        job_title: *a2
        title: *a2
        time_limit_seconds: *a5
        version_number: *a6
        status: *a7
    AvailableExam:
      type: object
      additionalProperties: false
      required:
        - id
        - application_id
        - job_id
        - job_title
        - title
        - time_limit_seconds
        - question_count
        - attempt_id
        - status
        - deadline_at_utc
      properties:
        id: *a1
        application_id: *a1
        job_id: *a1
        job_title: *a2
        title: *a2
        time_limit_seconds:
          type: integer
        question_count:
          type: integer
        attempt_id:
          type: string
          pattern: ^[1-9][0-9]{0,19}$
          nullable: true
        status:
          type: string
          enum:
            - AVAILABLE
            - IN_PROGRESS
            - SUBMITTED
            - EXPIRED
        deadline_at_utc:
          type: string
          format: date-time
          nullable: true
    ExamAnswer:
      type: object
      additionalProperties: false
      required:
        - question_id
        - option_id
        - client_revision
        - accepted_at_utc
      properties:
        question_id: *a1
        option_id: *a1
        client_revision:
          type: integer
          minimum: 1
          maximum: 4294967295
        accepted_at_utc: &a8
          type: string
          format: date-time
    ExamAttempt:
      type: object
      additionalProperties: false
      required:
        - id
        - exam_id
        - application_id
        - started_at_utc
        - deadline_at_utc
        - finished_at_utc
        - status
        - answers
      properties:
        id: *a1
        exam_id: *a1
        application_id: *a1
        started_at_utc: *a8
        deadline_at_utc: *a8
        finished_at_utc:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - IN_PROGRESS
            - SUBMITTED
            - EXPIRED
        answers:
          type: array
          items:
            $ref: "#/components/schemas/ExamAnswer"
    CandidateExamView:
      type: object
      additionalProperties: false
      required:
        - server_now
        - attempt
        - exam
      properties:
        server_now: *a8
        attempt:
          $ref: "#/components/schemas/ExamAttempt"
        exam:
          type: object
          additionalProperties: false
          required:
            - id
            - title
            - job_title
            - time_limit_seconds
            - version_number
            - questions
          properties:
            id: *a1
            title: *a2
            job_title: *a2
            time_limit_seconds:
              type: integer
            version_number:
              type: integer
            questions:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - id
                  - text
                  - options
                properties:
                  id: *a1
                  text: *a2
                  options:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - text
                      properties:
                        id: *a1
                        text: *a2
    CvProfile:
      type: object
      additionalProperties: false
      required: [name, email, phone, location, summary, education, experience, skills, languages]
      properties:
        name: {type: string, maxLength: 160, minLength: 2}
        email: {type: string, maxLength: 254}
        phone: {type: string, maxLength: 32}
        location: {type: string, maxLength: 200}
        summary: {type: string, maxLength: 4000}
        education:
          type: array
          maxItems: 30
          items: {type: string, maxLength: 4000}
        experience:
          type: array
          maxItems: 30
          items: {type: string, maxLength: 4000}
        skills:
          type: array
          maxItems: 80
          items: {type: string, maxLength: 200}
        languages:
          type: array
          maxItems: 80
          items: {type: string, maxLength: 200}
    CvConfirmed:
      type: object
      nullable: true
      required: [id, source_cv_id, confirmed_at, profile]
      properties:
        id: {type: string}
        source_cv_id: {type: string}
        confirmed_at: {type: string, format: date-time}
        profile: {$ref: '#/components/schemas/CvProfile'}
    CvReview:
      type: object
      required: [application_id, title, status, document, extraction, confirmed, current_profile_id, can_confirm]
      properties:
        application_id: {type: string}
        title: {type: string}
        status: {type: string, nullable: true}
        document:
          type: object
          nullable: true
          properties:
            id: {type: string}
            filename: {type: string}
        extraction:
          type: object
          nullable: true
          description: Solo para el postulante. Los campos vacíos son datos no detectados; no son datos confirmados.
          properties:
            version: {type: string}
            profile:
              type: object
              description: Mismos nueve campos de CvProfile; name puede estar vacío antes de confirmar.
              additionalProperties: true
            text: {type: string}
            warnings: {type: array, items: {type: string}}
            evidence:
              type: object
              additionalProperties:
                type: array
                items:
                  type: object
                  properties:
                    page: {type: integer, minimum: 1}
                    text: {type: string}
        confirmed: {$ref: '#/components/schemas/CvConfirmed'}
        current_profile_id: {type: string, nullable: true}
        can_confirm: {type: boolean}
    CvNotes:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, body, created_at]
            properties:
              id: {type: string}
              body: {type: string, maxLength: 4000}
              created_at: {type: string, format: date-time}
    ApplicationM03:
      type: object
      required: [id, job_id, title, status, created_at, submitted_at, filename]
      properties:
        id: {type: string}
        job_id: {type: string}
        title: {type: string}
        status: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        submitted_at: {type: string, format: date-time, nullable: true}
        filename: {type: string, nullable: true}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string, format: uuid}
    ProfileInput:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        email: {type: string, format: email, maxLength: 254}
        phone: {type: string, nullable: true, maxLength: 32, description: 'Opcional; entre 7 y 15 dígitos, con separadores habituales.'}
        dni: {type: string, nullable: true, pattern: '^([0-9]{8})?$', description: 'DNI peruano opcional; conserva ceros iniciales. Una cadena vacía elimina el DNI.'}
    RegisterCandidate:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password, minLength: 8, maxLength: 128, writeOnly: true}
        phone: {type: string, nullable: true, maxLength: 32}
    RegisterRecruiter:
      type: object
      additionalProperties: false
      required: [name, email, password, kind]
      properties:
        name: {type: string, minLength: 2, maxLength: 160}
        email: {type: string, format: email, maxLength: 254, description: Correo corporativo para COMPANY; filtro básico de proveedores públicos conocidos.}
        password: {type: string, format: password, minLength: 8, maxLength: 128, writeOnly: true}
        kind: {type: string, enum: [COMPANY, INDIVIDUAL]}
        phone: {type: string, nullable: true, maxLength: 32, description: Obligatorio para INDIVIDUAL.}
    User:
      type: object
      required: [id, name, email, phone, dni, role, kind, account_state, email_verified, phone_verified]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: string, nullable: true}
        dni: {type: string, nullable: true, pattern: '^[0-9]{8}$'}
        role: {type: string, enum: [CANDIDATE, RECRUITER]}
        kind: {type: string, nullable: true, enum: [COMPANY, INDIVIDUAL, null]}
        account_state: {type: string}
        email_verified: {type: boolean}
        phone_verified: {type: boolean}
    Session:
      type: object
      required: [user, expires_at]
      properties:
        user: {$ref: '#/components/schemas/User'}
        expires_at: {type: string, format: date-time}
    JobInput:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 10000
          default: ""
        requirements:
          type: array
          maxItems: 50
          default: []
          items:
            type: object
            additionalProperties: false
            required:
              - description
            properties:
              description:
                type: string
                minLength: 1
                maxLength: 1000
        area:
          type: string
          nullable: true
          maxLength: 120
        location:
          type: string
          nullable: true
          maxLength: 180
        modality:
          type: string
          nullable: true
          maxLength: 30
        work_schedule:
          type: string
          nullable: true
          maxLength: 120
        responsibilities:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 1000 }
        benefits:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 1000 }
        experience_required:
          type: string
          nullable: true
          maxLength: 2000
        education_required:
          type: string
          nullable: true
          maxLength: 2000
    JobPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 10000
          default: ""
        requirements:
          type: array
          maxItems: 50
          default: []
          items:
            type: object
            additionalProperties: false
            required:
              - description
            properties:
              description:
                type: string
                minLength: 1
                maxLength: 1000
        area:
          type: string
          nullable: true
          maxLength: 120
        location:
          type: string
          nullable: true
          maxLength: 180
        modality:
          type: string
          nullable: true
          maxLength: 30
        work_schedule:
          type: string
          nullable: true
          maxLength: 120
        responsibilities:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 1000 }
        benefits:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 1000 }
        experience_required:
          type: string
          nullable: true
          maxLength: 2000
        education_required:
          type: string
          nullable: true
          maxLength: 2000
    PublishedJob:
      type: object
      required:
        - title
        - description
        - requirements
        - area
        - location
        - experience_required
        - education_required
        - id
        - status
        - published_at
        - closed_at
        - created_at
        - updated_at
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 10000
          default: ""
        requirements:
          type: array
          maxItems: 50
          default: []
          items:
            type: object
            additionalProperties: false
            required:
              - description
            properties:
              description:
                type: string
                minLength: 1
                maxLength: 1000
        area:
          type: string
          nullable: true
          maxLength: 120
        location:
          type: string
          nullable: true
          maxLength: 180
        modality:
          type: string
          nullable: true
          maxLength: 30
        work_schedule:
          type: string
          nullable: true
          maxLength: 120
        responsibilities:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 1000 }
        benefits:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 1000 }
        experience_required:
          type: string
          nullable: true
          maxLength: 2000
        education_required:
          type: string
          nullable: true
          maxLength: 2000
        id:
          type: string
        status:
          type: string
          description: DRAFT, PUBLISHED o CLOSED; estados heredados desconocidos no admiten cambios.
        published_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OwnedJob:
      allOf:
        - $ref: "#/components/schemas/PublishedJob"
        - type: object
          required:
            - owner_user_id
          properties:
            owner_user_id:
              type: string
    OwnedJobListItem:
      allOf:
        - $ref: "#/components/schemas/OwnedJob"
        - type: object
          required: [applicant_count]
          properties:
            applicant_count:
              type: integer
              minimum: 0
              description: Número de personas postulantes distintas, incluidos estados históricos.
  responses:
    Error:
      description: Error controlado; el código y mensaje indican el motivo. No incluye información interna.
      headers:
        X-Request-ID: {schema: {type: string, format: uuid}, description: Identificador de la solicitud.}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Registered:
      description: Cuenta persistida y activa; puede iniciar sesión inmediatamente. No requiere OTP, verificación ni aprobación externa.
      content:
        application/json:
          schema:
            type: object
            required: [user, message]
            properties:
              user: {$ref: '#/components/schemas/User'}
              message: {type: string}
    Session:
      description: Datos de la cuenta propia y vencimiento del servidor; nunca incluye el token.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Session'}
paths:
  /candidate/applications/{applicationId}/cv-extraction:
    get:
      tags: [CV]
      summary: Consultar propuesta y perfil confirmado propios; extrae CV anteriores a M04 al abrir
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvReview'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /candidate/applications/{applicationId}/cv/{documentId}:
    get:
      tags: [CV]
      summary: Consultar PDF privado por versión; comprueba propiedad de la postulación u oferta
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        - name: documentId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /recruiter/applications/{applicationId}/cv-extraction:
    get:
      tags: [CV]
      summary: Consultar perfil confirmado de una postulación de una oferta propia
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvReview'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /recruiter/applications/{applicationId}/cv/{documentId}:
    get:
      tags: [CV]
      summary: Consultar PDF privado por versión; comprueba propiedad de la postulación u oferta
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        - name: documentId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /candidate/applications/{applicationId}/profile-confirmation:
    put:
      tags: [CV]
      summary: Confirmar correcciones y actualizar perfil curricular, nombre y teléfono; conserva el correo de acceso
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        - {$ref: '#/components/parameters/ClientHeader'}
      description: Requiere postulación PENDING y CV vigente. Repetir el mismo contenido es idempotente. Un CV ya confirmado no admite cambios (B-07). Conflictos de documento o perfil concurrente devuelven 409. El contenido completo del perfil no puede superar 60000 bytes JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [document_id, base_profile_id, profile]
              properties:
                document_id: {type: string}
                base_profile_id: {type: string, nullable: true}
                profile: {$ref: '#/components/schemas/CvProfile'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvReview'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /candidate/profile:
    get:
      tags: [CV]
      summary: Consultar la última versión curricular confirmada del usuario
      security: [{CookieSession: []}]
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: {$ref: '#/components/schemas/CvConfirmed'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /recruiter/jobs/{jobId}/applications:
    get:
      tags: [CV]
      summary: Listar postulaciones para revisar CV de una oferta propia
      security: [{CookieSession: []}]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}
                        title: {type: string}
                        confirmed: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /recruiter/applications/{applicationId}/notes:
    get:
      tags: [CV]
      summary: Consultar notas propias de revisión del CV
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
      responses:
        '200':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvNotes'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    post:
      tags: [CV]
      summary: Agregar una nota sin modificar el perfil fuente
      security: [{CookieSession: []}]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        - {$ref: '#/components/parameters/ClientHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 4000}
      responses:
        '201':
          description: Operación completada; datos privados con Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvNotes'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /recruiter/jobs/{jobId}/finish:
    post:
      tags: [Postulaciones]
      summary: Finalizar el proceso de selección de una oferta propia
      description: Cierra la recepción, registra la fecha de finalización e inicia el plazo de conservación. Es idempotente.
      security: [{CookieSession: []}]
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/ClientHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, maxProperties: 0}
      responses:
        '200':
          description: Proceso finalizado
          content:
            application/json:
              schema:
                type: object
                required: [finished_at]
                properties:
                  finished_at: {type: string, format: date-time}
        '400': {description: Entrada inválida}
        '401': {description: Sesión no válida}
        '403': {description: Rol u origen no autorizado}
        '404': {description: Oferta ajena o inexistente}
        '409': {description: Oferta en borrador}
  /candidate/cv-preview:
    post:
      tags: [Postulaciones]
      summary: Extraer datos de un CV PDF antes de enviar una postulación
      description: Procesa el archivo en memoria sin guardar documentos, crear postulaciones ni modificar perfiles. Reutiliza las reglas de extracción del CV; los datos ausentes quedan vacíos.
      security: [{CookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ClientHeader'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cv]
              additionalProperties: false
              properties:
                cv: {type: string, format: binary, description: 'PDF digital con texto, hasta 5.000.000 bytes, 40 páginas y 160.000 caracteres extraídos.'}
      responses:
        '200':
          description: Propuesta editable; aún no se ha enviado ninguna postulación
          content:
            application/json:
              schema:
                type: object
                required: [profile, warnings]
                properties:
                  profile:
                    type: object
                    description: Los nueve campos de CvProfile, con name vacío cuando no se detecta. No son datos confirmados.
                    required: [name, email, phone, location, summary, education, experience, skills, languages]
                    properties:
                      name: {type: string}
                      email: {type: string}
                      phone: {type: string}
                      location: {type: string}
                      summary: {type: string}
                      education: {type: array, items: {type: string}}
                      experience: {type: array, items: {type: string}}
                      skills: {type: array, items: {type: string}}
                      languages: {type: array, items: {type: string}}
                  warnings: {type: array, items: {type: string}}
        '400': {description: PDF inválido, sin texto o campos adicionales}
        '401': {description: Sesión no válida}
        '403': {description: Rol u origen no autorizado}
        '413': {description: Archivo demasiado grande}
  /applications:
    get:
      tags: [Postulaciones]
      summary: Consultar las postulaciones del candidato autenticado
      security: [{CookieSession: []}]
      responses:
        '200':
          description: Postulaciones propias
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ApplicationM03'}
        '401': {description: Sesión no válida}
        '403': {description: Rol no autorizado}
  /jobs/{jobId}/applications:
    post:
      tags: [Postulaciones]
      summary: Registrar una postulación con CV PDF
      description: La oferta debe estar publicada. Se rechazan postulaciones activas duplicadas.
      security: [{CookieSession: []}]
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/ClientHeader'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cv]
              properties:
                cv: {type: string, format: binary, description: 'PDF con texto seleccionable de hasta 5 MB (5.000.000 bytes), 40 páginas y 160.000 caracteres extraídos. La extracción M04 se guarda junto al archivo.'}
      responses:
        '201':
          description: Postulación registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationM03'}
        '400': {description: PDF inválido}
        '401': {description: Sesión no válida}
        '403': {description: Rol u origen no autorizado}
        '404': {description: Oferta no disponible}
        '409': {description: Postulación activa existente}
        '413': {description: Archivo demasiado grande}
  /applications/{applicationId}/cv:
    put:
      tags: [Postulaciones]
      summary: Reemplazar el CV de una postulación propia pendiente de evaluación
      security: [{CookieSession: []}]
      parameters:
        - {name: applicationId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/ClientHeader'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cv]
              properties:
                cv: {type: string, format: binary}
      responses:
        '200':
          description: CV actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationM03'}
        '400': {description: PDF inválido}
        '401': {description: Sesión no válida}
        '403': {description: Rol u origen no autorizado}
        '404': {description: Postulación no encontrada}
        '409': {description: El estado no permite reemplazar el CV}
        '413': {description: Archivo demasiado grande}
  /system/health:
    get:
      tags: [Sistema]
      summary: Comprobar API sin depender de MySQL
      responses:
        '200':
          description: API activa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: qori-talento-api}
  /system/db-check:
    get:
      tags: [Sistema]
      summary: Comprobar MySQL (solo fuera de producción)
      responses:
        '200':
          description: SELECT 1 ejecutado
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: {type: boolean}
        '503': {$ref: '#/components/responses/Error'}
  /auth/candidates/register:
    post:
      tags: [Auth]
      summary: Registrar postulante (activo de inmediato)
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterCandidate'}
      responses:
        '201': {$ref: '#/components/responses/Registered'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/recruiters/register:
    post:
      tags: [Auth]
      summary: Registrar reclutador de empresa o particular (activo de inmediato)
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRecruiter'}
      responses:
        '201': {$ref: '#/components/responses/Registered'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión con cuenta activa y verificada
      description: >-
        Cookie de navegador HttpOnly, SameSite=Strict, Path=/api; Secure en producción.
        Token aleatorio de 256 bits; solo su hash se guarda en MySQL.
        Caducidad por inactividad configurable con SESSION_IDLE_MINUTES (30 en desarrollo).
        Las cuentas nuevas quedan activas y pueden iniciar sesión de inmediato, sin verificación ni aprobación externa.
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, format: password, maxLength: 128, writeOnly: true}
      responses:
        '200':
          description: Sesión iniciada; se establece qt_session.
          headers:
            Set-Cookie: {schema: {type: string}, description: Cookie HttpOnly; el token no aparece en JSON.}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revocar sesión actual y borrar cookie (idempotente)
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '204': {description: Sesión revocada; cookie eliminada.}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/session/refresh:
    post:
      tags: [Auth]
      summary: Renovar por actividad una sesión que todavía no ha expirado
      security: [{CookieSession: []}]
      parameters: [{$ref: '#/components/parameters/ClientHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /me:
    get:
      tags: [Auth]
      summary: Consultar solo el perfil de la sesión validada
      security: [{CookieSession: []}]
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Auth]
      summary: Actualizar nombre, correo y teléfono propios
      description: >-
